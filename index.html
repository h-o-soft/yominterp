<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- CSP: 外部スクリプト禁止。connect-src はユーザー設定の LLM endpoint へ接続するため http/https を許可
         (https ページからの http://127.0.0.1 ローカル LLM 接続は loopback 例外で可能だが、
          connect-src * はスキーム違いの http: を含まないため明示する)。
         connect-src の 'self' は必須: Tauri では同一オリジンが tauri://localhost で、
         https:/http: に含まれず、emglken WASM の fetch が遮断されて
         「起動エラー: TypeError: Load failed」になる (実害発生・再発防止) -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https: http:; object-src 'none'; base-uri 'none'"
    />
    <title data-i18n="docTitle">yominterp — 英語IFを日本語で遊ぶ</title>
    <!-- 同梱フォント (PlemolJP HS) の先読み — クラシック端末の桁計算を担う本命フォント。
         as=font の preload は同一オリジンでも crossorigin 必須 -->
    <link rel="preload" href="/fonts/PlemolJPHS-Regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/PlemolJPHS-Bold.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/src/web/style.css" />
  </head>
  <!-- クラシック端末専用 (80×24 桁・単一表示モデル) -->
  <body>
    <div id="app">
      <!-- 上部バーはゲームのステータスライン専用 (場所名 + 右寄せ情報を省略せず全幅で)。
           アプリ操作の☰メニューは下部 (入力バー) に置き、ステータスと衝突させない -->
      <header id="topbar">
        <div id="status-line" data-i18n-title="statusTitle" title="ステータス行 (場所名・得点・手数 等)">
          <span id="status-left"></span>
          <span id="status-right"></span>
        </div>
      </header>
      <nav id="topbar-menu" hidden data-i18n-aria="menuTitle" aria-label="メニュー">
        <button id="btn-open-top" data-i18n="menuOpen">📂 開く…</button>
        <button id="btn-raw" data-i18n="menuRaw">原文の表示</button>
        <button id="btn-save" data-i18n="menuSave">セーブ</button>
        <button id="btn-restore" data-i18n="menuRestore">ロード</button>
        <button id="btn-settings" data-i18n="menuSettings">設定…</button>
      </nav>
      <main id="terminal" aria-live="polite"></main>
      <footer id="inputbar">
        <div id="choices" hidden></div>
        <form id="input-form">
          <button id="btn-menu" type="button" class="hamburger" data-i18n-title="menuTitle" title="メニュー" aria-haspopup="true" aria-expanded="false">☰</button>
          <span id="prompt-mark">&gt;</span>
          <input id="input" autocomplete="off" data-i18n-placeholder="inputPlaceholder" placeholder="日本語で指示してください" disabled />
          <button id="btn-send" data-i18n="send" disabled>送信</button>
        </form>
      </footer>
    </div>

    <dialog id="settings-dialog">
      <form method="dialog" id="settings-form">
        <h2 data-i18n="settingsTitle">設定</h2>
        <fieldset>
          <legend data-i18n="llmConnection">LLM 接続 (OpenAI 互換)</legend>
          <label><span data-i18n="baseUrlLabel">Base URL</span> <input id="set-baseurl" placeholder="http://127.0.0.1:1234/v1" /></label>
          <label
            ><span data-i18n="apiKeyLabel">API Key</span> <input id="set-apikey" type="password" autocomplete="off" />
            <small><label><input type="checkbox" id="set-persistkey" /><span data-i18n="apiKeyPersist">このブラウザに保存する (既定はメモリのみ。共有PCでは保存しないでください)</span></label></small>
          </label>
          <label><span data-i18n="modelLabel">モデル</span> <input id="set-model" list="model-list" /><datalist id="model-list"></datalist></label>
          <button type="button" id="btn-test" data-i18n="connectionTest">接続テスト</button>
          <span id="test-result"></span>
        </fieldset>
        <fieldset>
          <legend data-i18n="gameSection">ゲーム</legend>
          <div id="game-buttons">
            <button type="button" id="btn-open" data-i18n="openFile">ファイルを開く…</button>
            <button type="button" id="btn-open-url" data-i18n="openUrl">URLから開く…</button>
            <input type="file" id="file-input" accept=".z3,.z4,.z5,.z8,.zblorb,.ulx,.gblorb" hidden />
          </div>
          <small data-i18n="formatSupport">対応: .z3 .z4 .z5 .z8 .zblorb (Glulx は今後対応予定)</small>
        </fieldset>
        <fieldset>
          <legend data-i18n="playLanguage">プレイ言語</legend>
          <label><span data-i18n="languageLabel">言語</span> <select id="set-language"></select></label>
          <small id="lang-note" data-i18n="betaNotice">
            ⚠ 多言語は<strong>実験的機能</strong>です。翻訳の品質は使う LLM のモデルに大きく依存します。
            既定は日本語。日本語以外を選ぶと入力・ゲーム表示がその言語になります (メニュー等の UI 文言は当面日本語のまま)。
            <strong>変更は次に開くゲームから反映</strong>されます。
          </small>
        </fieldset>
        <fieldset>
          <legend data-i18n="otherSection">その他</legend>
          <button type="button" id="btn-download-log" data-i18n="downloadLog">ログをダウンロード</button>
          <small id="about" data-i18n="aboutText">
            VM: emglken (Bocfel/Glulxe — MIT)。本アプリは MIT ライセンスで、ゲームファイルはユーザーが用意します。
          </small>
        </fieldset>
        <menu>
          <button value="cancel" data-i18n="close">閉じる</button>
        </menu>
      </form>
    </dialog>

    <dialog id="save-dialog">
      <form method="dialog">
        <h2 id="save-title" data-i18n="saveTitle">セーブ</h2>
        <div id="save-slots"></div>
        <label id="save-name-row"><span data-i18n="nameLabel">名前</span> <input id="save-name" placeholder="slot1" /></label>
        <menu>
          <button value="ok" id="save-ok" data-i18n="ok">決定</button>
          <button value="cancel" data-i18n="cancel">キャンセル</button>
        </menu>
      </form>
    </dialog>

    <script type="module" src="/src/web/main.ts"></script>
  </body>
</html>
