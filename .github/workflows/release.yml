# yominterp デスクトップ版リリース
#
# トリガ: `v*` タグの push (例: git tag v0.1.0 && git push origin v0.1.0)。
# tauri-action が OS 別にビルドし、GitHub Release (draft) にバイナリを添付する。
# draft のままなら外部には公開されない — publish は最終確認後に手動で行う。
#   - macOS: .dmg / .app (Apple Silicon のみ。Intel mac は OS サポート終了が近く対象外)
#     **Developer ID 署名 + notarization 必須** (Secrets 欠落時はジョブを fail fast —
#     未署名の mac バイナリを黙ってリリースしない)
#   - Windows: .msi / setup.exe (NSIS) — 未署名 (証明書未保有)。SmartScreen の
#     回避手順は releaseBody と README に記載
#   - Linux(任意): .AppImage / .deb — 配布する場合は matrix のコメントを外す

name: Release (desktop)

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    permissions:
      contents: write # Release 作成・アセット添付に必要
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: '--target aarch64-apple-darwin'
          - platform: windows-latest
            args: ''
          # Linux も配布する場合はコメントを外す
          # - platform: ubuntu-22.04
          #   args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6
        with:
          # contents:write ジョブの書き込みトークンを git 認証情報として残さない
          # (npm ci のライフサイクルスクリプト等、後続処理からの push を防ぐ)
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      # タグの無検証リリースを防ぐガード: タグがアプリの version と一致し
      # (rc サフィックス許容: v0.1.0-rc.1 ⊃ 0.1.0)、main 上のコミットであること
      - name: Verify tag matches app version and sits on main
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER=$(node -p "require('./src-tauri/tauri.conf.json').version")
          case "$TAG" in
            "$VER"|"$VER"-*) echo "tag v$TAG matches app version $VER" ;;
            *) echo "::error::tag v$TAG does not match tauri.conf.json version $VER"; exit 1 ;;
          esac
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "::error::tagged commit is not on main"; exit 1; }

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.platform, 'macos') && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install npm deps
        run: npm ci

      # mac の配布物は「署名・公証済み」を保証する (Release ノート/README で断定して
      # いるため)。Secrets が欠けたまま黙って未署名でリリースが作られる事故を防ぐ —
      # 欠けている Secret の「名前だけ」を出して fail fast する (値はログに出さない)
      - name: Require signing secrets (macOS)
        if: contains(matrix.platform, 'macos')
        shell: bash
        env:
          HAS_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
          HAS_CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
          HAS_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
          HAS_ID: ${{ secrets.APPLE_ID != '' }}
          HAS_PW: ${{ secrets.APPLE_PASSWORD != '' }}
          HAS_TEAM: ${{ secrets.APPLE_TEAM_ID != '' }}
        run: |
          missing=()
          [ "$HAS_CERT" = "true" ] || missing+=(APPLE_CERTIFICATE)
          [ "$HAS_CERT_PW" = "true" ] || missing+=(APPLE_CERTIFICATE_PASSWORD)
          [ "$HAS_IDENTITY" = "true" ] || missing+=(APPLE_SIGNING_IDENTITY)
          [ "$HAS_ID" = "true" ] || missing+=(APPLE_ID)
          [ "$HAS_PW" = "true" ] || missing+=(APPLE_PASSWORD)
          [ "$HAS_TEAM" = "true" ] || missing+=(APPLE_TEAM_ID)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::macOS signing secrets missing: ${missing[*]} — リリースは署名必須です (Settings > Secrets に登録)"
            exit 1
          fi
          echo "all signing secrets present"

      - name: Build & release (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ---- macOS 署名 + notarization (Developer ID) ----
          # mac ジョブにのみ渡す (win ジョブや beforeBuildCommand 配下へ不要に
          # 広げない)。値は GitHub Secrets のみで管理 — ログ/コードには出さない。
          # 存在チェックは上の Require signing secrets ステップで fail fast 済み。
          APPLE_CERTIFICATE: ${{ contains(matrix.platform, 'macos') && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ contains(matrix.platform, 'macos') && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ contains(matrix.platform, 'macos') && secrets.APPLE_SIGNING_IDENTITY || '' }}
          # notarization (Apple ID + App用パスワード [appleid.apple.com で発行] 方式)。
          # 成功時は staple まで自動
          APPLE_ID: ${{ contains(matrix.platform, 'macos') && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ contains(matrix.platform, 'macos') && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ contains(matrix.platform, 'macos') && secrets.APPLE_TEAM_ID || '' }}
        with:
          # beforeBuildCommand (npm run build:web) は tauri.conf.json に定義済み
          tagName: ${{ github.ref_name }}
          releaseName: 'yominterp ${{ github.ref_name }}'
          releaseBody: |
            英語のインタラクティブフィクションを日本語で遊ぶプレイヤー yominterp のデスクトップ版です。

            - **macOS**: 署名・公証済みです。ダウンロードしてそのまま開けます。
            - **Windows**: ビルドは署名されていないため、初回起動時に SmartScreen の警告が出ます。
              **「詳細情報」→「実行」**を選んでください。

            遊び方・LLM の設定は [README](https://github.com/h-o-soft/yominterp#readme) を参照してください。
            ゲームファイルは同梱されていません。お手持ちの作品をご用意ください。
          releaseDraft: true
          # サフィックス付きタグ (v0.1.0-rc.1 等) は prerelease として作成する
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}
